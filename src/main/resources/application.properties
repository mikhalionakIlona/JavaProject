server.port=${PORT:8080}

spring.application.name=photostudio

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/photostudio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:221225}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

spring.mvc.format.date-time=iso

server.tomcat.connection-timeout=120000
server.tomcat.max-connections=15000
server.tomcat.threads.max=1500
spring.mvc.async.request-timeout=120000

server.tomcat.threads.min-spare=300
server.tomcat.accept-count=3000

spring.datasource.hikari.maximum-pool-size=200
spring.datasource.hikari.minimum-idle=50
spring.datasource.hikari.connection-timeout=120000

spring.task.execution.pool.core-size=200
spring.task.execution.pool.max-size=800
spring.task.execution.pool.queue-capacity=5000

server.tomcat.keep-alive-timeout=120000
server.tomcat.max-keep-alive-requests=100

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=true

spring.aop.auto=${AOP_AUTO:true}
spring.aop.proxy-target-class=${AOP_PROXY_TARGET:true}

logging.file.path=./logs
logging.file.name=${logging.file.path}/${spring.application.name}.log

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

spring.output.ansi.enabled=always
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

logging.level.com.example.photostudio=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE